name: MediMind AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations Check
        env:
          DATABASE_URL: sqlite:///./test_hospital.db
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_ci_cd_pipeline_2026
        run: |
          python -m pytest --cov=backend/app --cov-report=term-missing

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config
