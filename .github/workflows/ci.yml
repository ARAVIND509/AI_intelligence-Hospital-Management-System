name: MediMind AI CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: test_secret_key_ci_cd_pipeline_2026
      DATABASE_URL: sqlite:///./test_hospital.db

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Writable Test Database
        run: |
          rm -f test_hospital.db backend/test_hospital.db tests/backend/test_hospital.db
          touch test_hospital.db tests/backend/test_hospital.db
          chmod 666 test_hospital.db tests/backend/test_hospital.db

      - name: Run Alembic Database Migrations Check
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Generate CI TLS certificates
        run: |
          install -d -m 700 deployment/nginx/ssl
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout deployment/nginx/ssl/server.key \
            -out deployment/nginx/ssl/server.crt \
            -days 1 \
            -subj "/CN=localhost"
          chmod 600 deployment/nginx/ssl/server.key
          chmod 644 deployment/nginx/ssl/server.crt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest --cov=backend/app --cov-report=term-missing

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config
