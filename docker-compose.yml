version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: medimind-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medimind_db}
      POSTGRES_USER: ${POSTGRES_USER:-medimind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medimind_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medimind_user} -d ${POSTGRES_DB:-medimind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medimind-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medimind-backend
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://medimind_user:medimind_secure_password_2026@database:5432/medimind_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-medimind_prod_secret_key_super_secure_2026_change_in_production}
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medimind-worker
    restart: always
    command: python -m app.jobs.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://medimind_user:medimind_secure_password_2026@database:5432/medimind_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: production
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: medimind-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  app_logs:
