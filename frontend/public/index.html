<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMind AI — Hospital Management System</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        .badge {
            background-color: #e0f2fe;
            color: var(--primary-dark);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            display: inline-block;
            margin-bottom: 1rem;
        }
        h1 {
            color: var(--text);
            margin-top: 0;
            font-size: 2rem;
        }
        p {
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .btn-group {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: var(--primary-dark);
        }
        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text);
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Production Ready — Phase 12</span>
        <h1>MediMind AI Hospital System</h1>
        <p>Welcome to MediMind AI Hospital Management System portal. Local on-premise deployment active.</p>
        <div class="btn-group">
            <a href="/docs" class="btn">API Documentation</a>
            <a href="/api/v1/health" class="btn btn-secondary">System Health</a>
        </div>
    </div>
</body>
</html>
